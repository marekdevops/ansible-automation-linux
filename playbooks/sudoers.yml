---
# Moduł SUDOERS - Konfiguracja uprawnień sudo dla użytkowników i grup
# Plik: playbooks/sudoers.yml
# Użycie: ./run-automation.sh sudoers -e "user=nazwa"
#        ./run-automation.sh sudoers -e "group=nazwa_grupy"      (grupa lokalna - sprawdza czy istnieje)
#        ./run-automation.sh sudoers -e "groupldap=nazwa_grupy"  (grupa AD/LDAP - bez sprawdzania)
#        ./run-automation.sh sudoers -e "groupldap=nazwa_grupy target_user=uzytkownik"  (przełączenie na użytkownika)

- name: "SUDOERS MODULE - Konfiguracja uprawnień sudo"
  hosts: all
  gather_facts: true
  become: true

  vars:
    # Podstawowe zmienne - użytkownik lub grupa
    sudoers_user: "{{ user | default('') }}"
    sudoers_group: "{{ group | default('') }}"
    sudoers_group_ldap: "{{ groupldap | default('') }}"
    sudoers_target_user: "{{ target_user | default('') }}"
    sudoers_commands_file: "{{ commands_file | default('sudo_commands') }}"
    sudoers_file_priority: "{{ priority | default('98') }}"

    # Określ tryb (user/group/groupldap) i nazwę podmiotu
    sudoers_mode: "{{ 'groupldap' if sudoers_group_ldap != '' else ('group' if sudoers_group != '' else 'user') }}"
    sudoers_subject: "{{ sudoers_group_ldap if sudoers_mode == 'groupldap' else (sudoers_group if sudoers_mode == 'group' else sudoers_user) }}"
    sudoers_subject_prefix: "{{ '%' if sudoers_mode in ['group', 'groupldap'] else '' }}"

    # Tryb target_user - tylko przełączenie na użytkownika
    sudoers_target_user_mode: "{{ sudoers_target_user != '' }}"

    # Ścieżki
    sudoers_dir: "/etc/sudoers.d"
    sudoers_file_path: "{{ sudoers_dir }}/{{ sudoers_file_priority }}-{{ sudoers_subject }}"
    commands_template_path: "{{ playbook_dir }}/../templates/{{ sudoers_commands_file }}"

  pre_tasks:
    - name: "Sprawdź czy podano nazwę użytkownika lub grupy"
      fail:
        msg: |
          Musisz podać nazwę użytkownika lub grupy!
          Użyj: ./run-automation.sh sudoers -e "user=nazwa_uzytkownika"
          Lub:  ./run-automation.sh sudoers -e "group=nazwa_grupy"      (grupa lokalna)
          Lub:  ./run-automation.sh sudoers -e "groupldap=nazwa_grupy"  (grupa AD/LDAP)
      when: sudoers_user == "" and sudoers_group == "" and sudoers_group_ldap == ""
      tags: always

    - name: "Sprawdź czy użytkownik istnieje w systemie"
      getent:
        database: passwd
        key: "{{ sudoers_user }}"
      register: user_exists_check
      failed_when: user_exists_check.failed and not ansible_check_mode
      ignore_errors: "{{ ansible_check_mode }}"
      when: sudoers_mode == 'user'
      tags: always

    - name: "Sprawdź czy grupa lokalna istnieje w systemie"
      getent:
        database: group
        key: "{{ sudoers_group }}"
      register: group_exists_check
      failed_when: group_exists_check.failed and not ansible_check_mode
      ignore_errors: "{{ ansible_check_mode }}"
      when: sudoers_mode == 'group'
      tags: always

    - name: "Info: Pomijam sprawdzanie grupy AD/LDAP"
      debug:
        msg: "Grupa AD/LDAP '{{ sudoers_group_ldap }}' - pomijam walidację (grupy AD mogą nie być widoczne przez getent)"
      when: sudoers_mode == 'groupldap'
      tags: always

    - name: "Wyświetl informacje o konfiguracji sudoers"
      debug:
        msg: |
          === KONFIGURACJA SUDOERS ===
          Tryb: {{ sudoers_mode }}{{ ' (AD/LDAP)' if sudoers_mode == 'groupldap' else '' }}{{ ' -> przełączenie na użytkownika' if sudoers_target_user_mode else '' }}
          {{ 'Grupa' if sudoers_mode in ['group', 'groupldap'] else 'Użytkownik' }}: {{ sudoers_subject }}
          {% if sudoers_target_user_mode %}
          Użytkownik docelowy: {{ sudoers_target_user }}
          {% else %}
          Szablon komend: {{ sudoers_commands_file }}
          {% endif %}
          Plik sudoers: {{ sudoers_file_path }}
          Priorytet: {{ sudoers_file_priority }}
      tags: always

  tasks:
    - name: "Sprawdź czy katalog sudoers.d istnieje"
      file:
        path: "{{ sudoers_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: sudoers

    - name: "Wczytaj komendy z pliku szablonu"
      set_fact:
        sudoers_commands: "{{ lookup('file', commands_template_path).split('\n') }}"
      when: not sudoers_target_user_mode
      tags: sudoers

    - name: "Wyświetl komendy do skonfigurowania"
      debug:
        msg: |
          === KOMENDY SUDO DLA {{ sudoers_subject | upper }} ({{ sudoers_mode | upper }}) ===
          {% for line in sudoers_commands %}
          {% if line.strip() and not line.strip().startswith('#') %}
          {% set commands = line.split(';') %}
          {% for command in commands %}
          {% if command.strip() %}
          - {{ command.strip() }}
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endfor %}
      when: not sudoers_target_user_mode
      tags: sudoers

    - name: "Info: Tryb przełączenia na użytkownika"
      debug:
        msg: |
          === PRZEŁĄCZENIE NA UŻYTKOWNIKA ===
          Grupa {{ sudoers_subject }} będzie mogła przełączyć się na użytkownika {{ sudoers_target_user }}
          Wpis sudoers: {{ sudoers_subject_prefix }}{{ sudoers_subject }} ALL=(root) NOPASSWD: /bin/su - {{ sudoers_target_user }}, /usr/bin/su - {{ sudoers_target_user }}
      when: sudoers_target_user_mode
      tags: sudoers

    - name: "Utwórz backup istniejącego pliku sudoers (jeśli istnieje)"
      copy:
        src: "{{ sudoers_file_path }}"
        dest: "{{ sudoers_file_path }}.backup.{{ ansible_date_time.epoch }}"
        remote_src: yes
        owner: root
        group: root
        mode: '0440'
      when: ansible_check_mode == false
      failed_when: false
      tags: sudoers

    - name: "Wygeneruj plik sudoers dla użytkownika"
      template:
        src: "{{ playbook_dir }}/../templates/sudoers_user.j2"
        dest: "{{ sudoers_file_path }}"
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
        backup: yes
      register: sudoers_created
      tags: sudoers

    - name: "Sprawdź składnię wszystkich plików sudoers"
      command: visudo -c
      register: visudo_check
      changed_when: false
      failed_when: visudo_check.rc != 0
      when: not ansible_check_mode
      tags: sudoers

    - name: "Wyświetl zawartość utworzonego pliku"
      slurp:
        src: "{{ sudoers_file_path }}"
      register: sudoers_file_content
      when: not ansible_check_mode
      tags: sudoers

    - name: "Pokaż zawartość pliku sudoers"
      debug:
        msg: |
          === ZAWARTOŚĆ PLIKU {{ sudoers_file_path }} ===
          {{ sudoers_file_content.content | b64decode if not ansible_check_mode else 'Dry-run - plik nie został utworzony' }}
      tags: sudoers

    - name: "Test uprawnień sudo dla użytkownika"
      shell: |
        # Sprawdź czy użytkownik może używać sudo -l
        sudo -l -U {{ sudoers_subject }} | grep -E "(NOPASSWD|{{ sudoers_subject }})" || echo "Brak uprawnień"
      register: sudo_test
      changed_when: false
      failed_when: false
      when: sudoers_mode == 'user'
      tags: sudoers

    - name: "Wyświetl podsumowanie"
      debug:
        msg: |
          === PODSUMOWANIE KONFIGURACJI SUDOERS ===
          Tryb: {{ sudoers_mode }}{{ ' (AD/LDAP)' if sudoers_mode == 'groupldap' else '' }}{{ ' -> przełączenie na użytkownika' if sudoers_target_user_mode else '' }}
          {{ 'Grupa' if sudoers_mode in ['group', 'groupldap'] else 'Użytkownik' }}: {{ sudoers_subject }}
          {% if sudoers_target_user_mode %}
          Użytkownik docelowy: {{ sudoers_target_user }}
          {% endif %}
          Plik sudoers: {{ sudoers_file_path }}
          Status: {{ 'Dry-run - zmiany nie zostały zastosowane' if ansible_check_mode else ('Utworzony' if sudoers_created.changed else 'Już istniał') }}
          Walidacja: {{ 'Pomyślna' if (visudo_check is defined and visudo_check.rc is defined and visudo_check.rc == 0) else ('Pominięta' if ansible_check_mode else 'Błąd') }}

          === TESTOWANIE ===
          {% if sudoers_target_user_mode %}
          Aby przetestować, zaloguj się jako użytkownik z grupy {{ sudoers_subject }} i wykonaj:
          sudo su - {{ sudoers_target_user }}
          {% elif sudoers_mode == 'user' %}
          Aby przetestować uprawnienia, zaloguj się jako {{ sudoers_subject }}:
          sudo su - {{ sudoers_subject }}
          Następnie sprawdź dostępne komendy: sudo -l
          {% else %}
          Aby przetestować uprawnienia, zaloguj się jako użytkownik z grupy {{ sudoers_subject }}:
          Następnie sprawdź dostępne komendy: sudo -l
          {% endif %}

          === ZARZĄDZANIE ===
          Plik konfiguracyjny: {{ sudoers_file_path }}
          Usuń uprawnienia: sudo rm {{ sudoers_file_path }}
      tags: sudoers